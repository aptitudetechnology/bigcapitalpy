{% extends "base.html" %}

{% block title %}Create Credit Note - BigCapitalPy{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0 text-gray-800">Create Credit Note</h1>
    <a href="{{ url_for('credit_notes.index') }}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Back</a>
</div>

<form method="POST" action="{{ url_for('credit_notes.save') }}">
    <div class="row">
        <div class="col-lg-8">
            <div class="card shadow mb-4">
                <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-primary">Credit Note Details</h6></div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Customer <span class="text-danger">*</span></label>
                                <select class="form-select" name="customer_id" required>
                                    <option value="">Select Customer</option>
                                    {% for customer in customers %}
                                    <option value="{{ customer.id }}" {% if selected_invoice and customer.id == selected_invoice.customer_id %}selected{% endif %}>{{ customer.display_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Credit Note Number <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" name="credit_note_number" value="{{ next_number }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Reference</label>
                                <input type="text" class="form-control" name="reference">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Date <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" name="credit_note_date" value="{{ today.strftime('%Y-%m-%d') }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Related Invoice</label>
                                <input type="text" class="form-control" name="invoice_id" value="{{ selected_invoice.id if selected_invoice else '' }}" placeholder="Invoice ID (optional)">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow mb-4">
                <div class="card-header py-3 d-flex justify-content-between align-items-center">
                    <h6 class="m-0 font-weight-bold text-primary">Line Items</h6>
                    <button type="button" class="btn btn-sm btn-primary" onclick="addLineItem()"><i class="bi bi-plus"></i> Add</button>
                </div>
                <div class="card-body">
                    <table class="table table-borderless">
                        <thead><tr><th>Description <span class="text-danger">*</span></th><th style="width:10%;">Qty</th><th style="width:15%;">Rate</th><th style="width:12%;">Tax</th><th style="width:12%;">Amount</th><th style="width:5%;"></th></tr></thead>
                        <tbody id="lineItemsBody">
                            <tr class="line-item-row">
                                <td>
                                    <input type="hidden" name="item_id[]" value="">
                                    <input type="text" class="form-control form-control-sm" name="description[]" required>
                                </td>
                                <td><input type="number" class="form-control form-control-sm" name="quantity[]" value="1" step="0.01" onchange="calculateLineTotal(this)"></td>
                                <td><input type="number" class="form-control form-control-sm" name="rate[]" value="0.00" step="0.01" onchange="calculateLineTotal(this)"></td>
                                <td>
                                    <select class="form-select form-select-sm" name="tax_code_id[]">
                                        <option value="">None</option>
                                        {% for tc in tax_codes %}
                                        <option value="{{ tc.id }}" data-rate="{{ tc.rate }}">{{ tc.name }} ({{ tc.rate }}%)</option>
                                        {% endfor %}
                                    </select>
                                </td>
                                <td><input type="text" class="form-control form-control-sm line-amount" readonly value="0.00"></td>
                                <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="removeLineItem(this)"><i class="bi bi-trash"></i></button></td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="row justify-content-end mt-3">
                        <div class="col-md-4">
                            <table class="table table-sm">
                                <tr><td>Subtotal:</td><td class="text-end" id="subtotal">0.00</td></tr>
                                <tr><td>Tax:</td><td class="text-end" id="taxTotal">0.00</td></tr>
                                <tr class="fw-bold"><td>Total:</td><td class="text-end" id="grandTotal">0.00</td></tr>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow mb-4">
                <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-primary">Notes</h6></div>
                <div class="card-body"><textarea class="form-control" name="notes" rows="4"></textarea></div>
            </div>
            <div class="d-grid gap-2"><button type="submit" class="btn btn-primary btn-lg">Save Credit Note</button></div>
        </div>
    </div>
</form>

<script>
function addLineItem() { const tbody = document.getElementById('lineItemsBody'); const row = tbody.querySelector('.line-item-row').cloneNode(true); row.querySelectorAll('input[type="text"],input[type="number"]').forEach(i => { if(i.name==='quantity[]')i.value='1'; else if(i.name==='rate[]')i.value='0.00'; else i.value=''; }); row.querySelectorAll('select').forEach(s=>s.selectedIndex=0); row.querySelector('.line-amount').value='0.00'; tbody.appendChild(row); }
function removeLineItem(btn) { const tbody = document.getElementById('lineItemsBody'); if(tbody.children.length>1){btn.closest('tr').remove();calculateTotals();} }
function calculateLineTotal(el) { const row=el.closest('tr'); const qty=parseFloat(row.querySelector('[name="quantity[]"]').value)||0; const rate=parseFloat(row.querySelector('[name="rate[]"]').value)||0; row.querySelector('.line-amount').value=(qty*rate).toFixed(2); calculateTotals(); }
function calculateTotals() { let s=0,t=0; document.querySelectorAll('.line-item-row').forEach(row=>{ const a=parseFloat(row.querySelector('.line-amount').value)||0; s+=a; const ts=row.querySelector('[name="tax_code_id[]"]'); const r=parseFloat(ts.options[ts.selectedIndex]?.dataset?.rate)||0; t+=a*(r/100); }); document.getElementById('subtotal').textContent=s.toFixed(2); document.getElementById('taxTotal').textContent=t.toFixed(2); document.getElementById('grandTotal').textContent=(s+t).toFixed(2); }
document.addEventListener('change',function(e){if(e.target.name==='tax_code_id[]')calculateTotals();});
</script>
{% endblock %}
